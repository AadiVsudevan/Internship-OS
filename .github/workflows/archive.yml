name: Archive Expired Opportunities

on:
  workflow_dispatch: {}

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Archive expired items
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_OPPORTUNITIES_DB_ID: ${{ secrets.NOTION_OPPORTUNITIES_DB_ID }}
        run: python -m src.archive
